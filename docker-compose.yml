services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fornada
      POSTGRES_USER: fornada
      POSTGRES_PASSWORD: fornada_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fornada"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://fornada:fornada_dev@db:5432/fornada
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - ./backend:/app
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://fornada:fornada_dev@db:5432/fornada
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A infrastructure.celery.app worker --loglevel=info

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      # .next NAO e mais volume anonimo: deixa o Next gravar direto em /app/.next
      # dentro do bind mount, assim mudancas no host refletem imediatamente.
    environment:
      # NEXT_PUBLIC_API_URL fica em branco no dev: o frontend infere a URL
      # do backend automaticamente do host do navegador (localhost:3000 →
      # localhost:8000; 192.168.x.x:3000 → 192.168.x.x:8000). Configure no
      # .env apenas se o backend estiver em outro host (prod, CI).
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
      # WATCHPACK_POLLING forca o Next.js a usar polling em vez de inotify.
      # Necessario no Windows + WSL2 porque eventos de filesystem nao propagam
      # do host Windows para dentro do container via inotify.
      WATCHPACK_POLLING: "true"
    depends_on:
      - backend
    command: pnpm dev

volumes:
  postgres_data:
