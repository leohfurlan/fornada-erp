name: fornada-prod
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: fornada
      POSTGRES_USER: fornada
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U fornada -d fornada"]
      interval: 10s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 3s
      retries: 10
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    environment: &backend_environment
      DATABASE_URL: postgresql+asyncpg://fornada:${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD}@db:5432/fornada
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:?Configure SECRET_KEY}
      WHATSAPP_AUTH_ENABLED: ${WHATSAPP_AUTH_ENABLED:-false}
      EVOLUTION_API_URL: ${EVOLUTION_API_URL:-}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-}
      EVOLUTION_INSTANCE: ${EVOLUTION_INSTANCE:-}
      EVOLUTION_ENABLED: ${EVOLUTION_ENABLED:-false}
      EVOLUTION_WEBHOOK_SECRET: ${EVOLUTION_WEBHOOK_SECRET:-}
      FRONTEND_URL: ${FRONTEND_URL:-}
      ENVIRONMENT: production
      DEBUG: "false"
      GOOGLE_AI_API_KEY: ${GOOGLE_AI_API_KEY:-}
      GEMMA_OCR_MODEL: ${GEMMA_OCR_MODEL:-gemma-4-26b-a4b-it}
      GEMMA_OCR_TEMPERATURE: ${GEMMA_OCR_TEMPERATURE:-0.1}
      GEMMA_OCR_THINKING_LEVEL: ${GEMMA_OCR_THINKING_LEVEL:-minimal}
      OCR_PROVIDER: ${OCR_PROVIDER:-gemma}
      OCR_VISION_PROVIDER: ${OCR_VISION_PROVIDER:-gemma}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_OCR_MODEL: ${OPENAI_OCR_MODEL:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    environment: *backend_environment
    command: celery -A infrastructure.celery.app worker --loglevel=info --concurrency=1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Configure APP_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
